[project]
name = "coalitionkit-examples"
version = "0.1.0.dev0"
description = "CoalitionKit examples: members on real agent frameworks and the interop run"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "coalitionkit-contracts",
    "coalitionkit-edges",
    "coalitionkit-runtime",
    "coalitionkit-models",
    "google-adk==2.13.0",
    "langgraph==1.2.18",
    "langchain-openai==1.7.3",
    "langchain-core==1.7.1",
]

[tool.uv]
package = false
# zstandard 0.25.0 has no CPython 3.15 wheel and its sdist needs a C toolchain; langsmith (via
# langchain-core) lists it as a hard dependency but only uses it to compress tracing uploads.
override-dependencies = ["zstandard; python_version < '3.15'"]

[tool.uv.sources]
coalitionkit-contracts = { path = "../packages/contracts", editable = true }
coalitionkit-edges = { path = "../packages/edges", editable = true }
coalitionkit-runtime = { path = "../packages/runtime", editable = true }
coalitionkit-models = { path = "../packages/models", editable = true }

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the live Meta API; runs only with COALITIONKIT_LIVE=1 and a key"]
