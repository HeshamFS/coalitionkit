id: tool-redact-street-address
applies_to: [coalition.observe, coalition.offer]
when:
  any_text_matches:
    - '\b\d{1,5}[a-z]?\s+(?:[a-z]+\s+){1,2}(?:street|road|avenue|lane|close)\b'
then: redact
explain: "Street addresses are masked. The pickup note is enough for the room."
