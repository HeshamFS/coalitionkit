site_name: CoalitionKit
site_description: Open source kit for groups whose AI agents work toward one goal together, with every decision signed by a person.
site_url: https://heshamfs.github.io/coalitionkit/
repo_url: https://github.com/HeshamFS/coalitionkit
repo_name: HeshamFS/coalitionkit
edit_uri: edit/main/docs/
copyright: Apache License 2.0
docs_dir: docs
strict: true

theme:
  name: material
  logo: assets/logo-dark.svg
  favicon: assets/logo-blue.svg
  font:
    text: Geist
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/contracts/src
            - packages/vault/src
            - packages/runtime/src
            - packages/edges/src
            - packages/gardener/src
            - packages/models/src
            - packages/steward/src
            - packages/mcp_server/src
            - packages/acceptance/src
            - packages/surfaces/src
            - packages/server/src
            - packages/cli/src
            - packages/packs/src
            - packages/mint/src
            - packages/channels/src
            - packages/conformance/src
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

