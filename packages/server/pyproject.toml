[project]
name = "coalitionkit-server"
version = "0.1.0.dev0"
description = "Runnable CoalitionKit host and protocol surfaces"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "coalitionkit-runtime", "coalitionkit-contracts", "coalitionkit-edges",
    "coalitionkit-mcp", "coalitionkit-surfaces", "coalitionkit-steward",
    "coalitionkit-models", "coalitionkit-channels", "coalitionkit-packs",
    "pydantic-settings==2.16.2", "fastapi==0.162.0",
    "uvicorn==0.54.0", "httpx", "cryptography==50.0.2",
]

[project.scripts]
coalitionkit-server = "coalitionkit_server.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
