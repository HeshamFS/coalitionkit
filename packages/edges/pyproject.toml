[project]
name = "coalitionkit-edges"
version = "0.1.0.dev0"
description = "CoalitionKit edges: the A2A host and member edge, and card identity"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "coalitionkit-contracts",
    "a2a-sdk[http-server,signing]==1.3.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
