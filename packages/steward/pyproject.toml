[project]
name = "coalitionkit-steward"
version = "0.1.0.dev0"
description = "The Steward: deterministic policies, a model audit and signed verdicts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "coalitionkit-contracts",
    "coalitionkit-models",
    "cryptography==50.0.2",
    "pydantic==2.14.1",
    "ruamel.yaml==0.19.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
