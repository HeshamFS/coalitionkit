# SPDX-License-Identifier: Apache-2.0
[project]
name = "coalitionkit-langchain"
version = "0.1.0"
description = "CoalitionKit for LangChain: a room's actions as LangChain tools"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Hesham Salama", email = "hesham.salama@rub.de"}]
keywords = ["agents", "coordination", "langchain", "mcp", "coalition"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.15"]
requires-python = ">=3.15"
dependencies = [
    "httpx",
    "httpx2",
    "langchain-core==1.7.4",
    "mcp>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/HeshamFS/coalitionkit"
Repository = "https://github.com/HeshamFS/coalitionkit"
Issues = "https://github.com/HeshamFS/coalitionkit/issues"
Changelog = "https://github.com/HeshamFS/coalitionkit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
