# SPDX-License-Identifier: Apache-2.0
[project]
name = "coalitionkit-models"
version = "0.1.0"
description = "One OpenAI-compatible model gateway with per-role routing, retries and a cost meter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Hesham Salama", email = "hesham.salama@rub.de"}]
keywords = ["agents", "coordination", "a2a", "mcp", "coalition"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.15", "Operating System :: OS Independent", "Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.15"
dependencies = ["httpx2==2.16.0", "openai==3.40.0", "pydantic==2.14.1", "pydantic-settings==2.16.2"]

[project.urls]
Homepage = "https://github.com/HeshamFS/coalitionkit"
Repository = "https://github.com/HeshamFS/coalitionkit"
Issues = "https://github.com/HeshamFS/coalitionkit/issues"
Changelog = "https://github.com/HeshamFS/coalitionkit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
