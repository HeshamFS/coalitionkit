# SPDX-License-Identifier: Apache-2.0
[project]
name = "coalitionkit-contracts"
version = "0.1.0"
description = "CoalitionKit Core contracts: envelope, payload models, JCS, signing and schema validation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Hesham Salama", email = "hesham@autonomouslab.io"}]
keywords = ["agents", "coordination", "a2a", "mcp", "coalition"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Operating System :: OS Independent", "Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "jsonschema==4.26.0",
    "pydantic==2.14.2",
    "rfc3339-validator==0.1.4",
    "rfc3986-validator==0.1.1",
    "rfc8785==0.1.4",
]

[project.urls]
Homepage = "https://github.com/HeshamFS/coalitionkit"
Repository = "https://github.com/HeshamFS/coalitionkit"
Issues = "https://github.com/HeshamFS/coalitionkit/issues"
Changelog = "https://github.com/HeshamFS/coalitionkit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
