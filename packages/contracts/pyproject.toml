[project]
name = "coalitionkit-contracts"
version = "0.1.0.dev0"
description = "CoalitionKit Core contracts: envelope, payload models, JCS, signing and schema validation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "cryptography==50.0.2",
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "rfc3339-validator==0.1.4",
    "rfc3986-validator==0.1.1",
    "rfc8785==0.1.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
