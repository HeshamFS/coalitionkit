[project]
name = "coalitionkit-channels"
version = "0.1.0.dev0"
description = "CoalitionKit message-door transports (WhatsApp Cloud API)"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "coalitionkit-contracts",
    "coalitionkit-surfaces",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
