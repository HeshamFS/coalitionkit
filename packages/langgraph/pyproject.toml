# SPDX-License-Identifier: Apache-2.0
[project]
name = "coalitionkit-langgraph"
version = "0.1.0"
description = "CoalitionKit for LangGraph: run a graph as a seat, with an interrupt where a person must consent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Hesham Salama", email = "hesham.salama@rub.de"}]
keywords = ["agents", "coordination", "langgraph", "mcp", "coalition"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.15"]
requires-python = ">=3.15"
dependencies = [
    "coalitionkit-langchain==0.1.0",
    "langgraph==1.2.19",
]

[project.urls]
Homepage = "https://github.com/HeshamFS/coalitionkit"
Repository = "https://github.com/HeshamFS/coalitionkit"
Issues = "https://github.com/HeshamFS/coalitionkit/issues"
Changelog = "https://github.com/HeshamFS/coalitionkit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
