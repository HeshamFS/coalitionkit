# SPDX-License-Identifier: Apache-2.0
[project]
name = "coalitionkit"
version = "0.1.0"
description = "CoalitionKit: protocols, agents, private coordination and a local web room"
readme = {text = "CoalitionKit: protocols, agents, private coordination and a local web room", content-type = "text/plain"}
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Hesham Salama", email = "hesham@autonomouslab.io"}]
keywords = ["agents", "coordination", "a2a", "mcp", "coalition"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Operating System :: OS Independent", "Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.12"
dependencies = [
    "coalitionkit-acceptance==0.1.0",
    "coalitionkit-channels==0.1.0",
    "coalitionkit-cli==0.1.0",
    "coalitionkit-conformance==0.1.0",
    "coalitionkit-contracts==0.1.0",
    "coalitionkit-edges==0.1.0",
    "coalitionkit-gardener==0.1.0",
    "coalitionkit-mcp==0.1.0",
    "coalitionkit-mint==0.1.0",
    "coalitionkit-models==0.1.0",
    "coalitionkit-packs==0.1.0",
    "coalitionkit-runtime==0.1.0",
    "coalitionkit-server==0.1.0",
    "coalitionkit-steward==0.1.0",
    "coalitionkit-surfaces==0.1.0",
    "coalitionkit-vault==0.1.0"
]

[project.optional-dependencies]
whatsapp = ["coalitionkit-channels==0.1.0"]
postgres = ["coalitionkit-runtime[postgres]==0.1.0"]
langgraph = ["coalitionkit-langgraph==0.1.0"]
langchain = ["coalitionkit-langchain==0.1.0"]
psi = ["coalitionkit-vault[psi]==0.1.0"]
all = ["coalitionkit[whatsapp,postgres,langgraph,langchain,psi]==0.1.0"]

[project.urls]
Homepage = "https://github.com/HeshamFS/coalitionkit"
Repository = "https://github.com/HeshamFS/coalitionkit"
Issues = "https://github.com/HeshamFS/coalitionkit/issues"
Changelog = "https://github.com/HeshamFS/coalitionkit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
