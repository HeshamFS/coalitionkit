[project]
name = "coalitionkit-conformance"
version = "0.1.0.dev0"
description = "Black-box Coalition Protocol conformance probes"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = ["coalitionkit-contracts", "coalitionkit-edges", "httpx"]

[project.scripts]
coalitionkit-conform = "coalitionkit_conformance.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
