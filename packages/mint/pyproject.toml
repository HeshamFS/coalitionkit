[project]
name = "coalitionkit-mint"
version = "0.1.0.dev0"
description = "Fixed-template, owner-approved MCP agents"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "coalitionkit-contracts", "coalitionkit-models", "coalitionkit-steward",
    "coalitionkit-edges", "mcp>=2.3.0", "uvicorn==0.54.0", "pillow>=12.0.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
