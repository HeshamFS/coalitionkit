[project]
name = "coalitionkit-acceptance"
version = "0.1.0.dev0"
description = "CoalitionKit acceptance harness: scripted scenarios for ripple, scale, chaos and cost"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "coalitionkit-contracts",
    "coalitionkit-runtime",
    "coalitionkit-edges",
    "coalitionkit-gardener",
    "coalitionkit-models",
    "coalitionkit-vault",
    "coalitionkit-steward",
    "coalitionkit-surfaces",
    "coalitionkit-mcp",
    "mcp>=2.3.0",
    "httpx",
    "httpx2==2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
