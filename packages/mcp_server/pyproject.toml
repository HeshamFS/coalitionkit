[project]
name = "coalitionkit-mcp"
version = "0.1.0.dev0"
description = "CoalitionKit MCP server: any MCP host joins a Coalition with an A2A member's rights"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "coalitionkit-contracts",
    "coalitionkit-edges",
    "mcp>=2.3.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
