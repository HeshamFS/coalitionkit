id: daily-redact-street-address
applies_to: [coalition.observe, coalition.offer]
when:
  any_text_matches:
    - '\b\d{1,5}[a-z]?\s+(?:[a-z]+\s+){1,2}(?:street|road|avenue|lane|drive|close|square)\b'
    - '\b[a-z]+(?:strasse|straße|weg|allee|gasse)\s+\d{1,4}[a-z]?\b'
then: redact
explain: "Street addresses are masked; the place kind is enough for the room."
