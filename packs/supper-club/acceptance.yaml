# SPDX-License-Identifier: Apache-2.0
goal: "Five of us cook one dinner from our own kitchens on Saturday: agree the menu, get bread from a bakery, share the costs of 120 euro, book the oven for the roast, time the cooking, and draw the menu card"
members:
  - role: cook
    vault:
      free: ["Sat 15:00-19:00"]
      allergies: "fixture allergy C-SC-ALG-P1"
      address: "fixture kitchen C-SC-ADDR-P1"
      canary: "C-SC-ACC-P1"
  - role: cook
    vault:
      free: ["Sat 15:00-19:00"]
      allergies: "fixture allergy C-SC-ALG-P2"
      address: "fixture kitchen C-SC-ADDR-P2"
      canary: "C-SC-ACC-P2"
  - role: guest
    vault:
      free: ["Sat 16:00-19:00"]
      allergies: "fixture allergy C-SC-ALG-P3"
      address: "fixture kitchen C-SC-ADDR-P3"
      canary: "C-SC-ACC-P3"
  - role: absent-cook
    vault:
      free: ["Sat 14:00-17:00"]
      allergies: "fixture allergy C-SC-ALG-P4"
      address: "fixture kitchen C-SC-ADDR-P4"
      canary: "C-SC-ACC-P4"
    absent: true
businesses:
  - role: grocer
    card: { name: Corner grocer (simulated) }
offers:
  - member: p1
    need: 0
    offer:
      capacity: 1
      cost: { minutes: 30, money: 0, effort: low }
      valid_until: "2099-01-01T00:00:00Z"
      ext: { serves: 6 }
  - member: p2
    need: 1
    offer:
      capacity: 1
      cost: { minutes: 30, money: 0, effort: low }
      valid_until: "2099-01-01T00:00:00Z"
      ext: { serves: 6 }
  - member: p1
    need: 1
    offer:
      capacity: 1
      cost: { minutes: 60, money: 0, effort: medium }
      valid_until: "2099-01-01T00:00:00Z"
      ext: { serves: 6 }
  - member: p1
    need: 2
    offer:
      capacity: 1
      cost: { minutes: 20, money: 0, effort: low }
      valid_until: "2099-01-01T00:00:00Z"
  - member: p4
    need: 3
    offer:
      capacity: 1
      cost: { minutes: 45, money: 0, effort: medium }
      valid_until: "2099-01-01T00:00:00Z"
      ext: { course: main, serves: 6 }
  - member: p3
    need: 4
    offer:
      capacity: 1
      cost: { minutes: 45, money: 0, effort: low }
      valid_until: "2099-01-01T00:00:00Z"
  - member: p2
    need: 5
    offer:
      capacity: 1
      cost: { minutes: 20, money: 0, effort: low }
      valid_until: "2099-01-01T00:00:00Z"
expect:
  allocation: { 0: p1, 1: p2, 2: p1, 3: p4, 4: p3, 5: p2 }
  fairness: { max_share_ratio: 2 }
  commitments_signed_by_owner: true
  agent_only_yes_refused: true
  distinguishing:
    business_holds: { business: 0, need: 0 }
  change: { by: p2, invalidates: [1], affected: [1], untouched: [0, 2, 3, 4, 5] }
  policy_probe:
    by: p1
    type: coalition.observe
    payload: { source: chat, content: "Between us, I'm vegetarian and allergic to walnuts, so leave them out of my plate" }
    outcome: redact
    policy_id: supper-redact-diet
  dissolve: { reason: completed, lessons: 2 }
  canaries_leaked: 0
  max_messages: 240
