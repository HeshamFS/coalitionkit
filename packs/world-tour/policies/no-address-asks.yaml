id: world-no-address-asks
applies_to: [coalition.observe, coalition.offer]
when:
  any_text_matches:
    - '\b(?:what|which|send|share|give|tell)\b[^.?!]{0,40}\b(?:street|home|exact|postal)\s+address\b'
    - '\bwhere\s+(?:exactly\s+)?do\s+you\s+live\b'
    - '\b(?:your|their|his|her)\s+(?:street|home|exact|postal)\s+address\b'
then: escalate
explain: "A public table never asks a stranger for a street address; the city is all the tour needs."
