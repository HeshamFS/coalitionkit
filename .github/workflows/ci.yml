# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_CONCURRENT_BUILDS: '2'
  UV_CONCURRENT_INSTALLS: '2'
  RAYON_NUM_THREADS: '2'
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.15.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install optional PSI system library for its tests
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - run: uv sync --locked
      - run: npm install --global npm@11.10.0
      - run: uv run python tools/build_web.py
      - name: Python lint, formatting, types, boundaries, schemas, tests and packs
        run: uv run python tools/check.py
      - name: Web lint
        run: npm --prefix apps/web run lint
      - name: Web tests (two workers)
        run: npm --prefix apps/web run test:ci
      - run: uv run python tools/check_workflows.py
      - name: Clean wheel installation and HTTP smoke
        run: uv run python tools/smoke_install.py
