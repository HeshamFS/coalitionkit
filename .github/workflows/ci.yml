# SPDX-License-Identifier: Apache-2.0
# Every push and pull request runs the same checks a contributor runs locally. No model keys are
# used: live tests skip and say so, and the scorecard's live rows are produced by maintainers.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.15.2"
  COALITIONKIT_LIVE: "0"

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pyright runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
      # The vault's PSI uses libsodium (ristretto255) through pysodium.
      - name: Install libsodium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium23
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"
      - name: Sync the workspace
        run: uv sync --locked --python "${PYTHON_VERSION}"
      - name: Lint, types, import boundaries, tests and the core rule
        run: uv run --python "${PYTHON_VERSION}" python tools/check.py

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
