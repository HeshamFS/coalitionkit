# SPDX-License-Identifier: Apache-2.0
name: Publish Python distributions
on:
  workflow_dispatch:
    inputs:
      publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI needs a different publisher for each new project, so each package has its own environment.
    strategy:
      fail-fast: false
      matrix:
        package:
          - coalitionkit
          - coalitionkit-acceptance
          - coalitionkit-channels
          - coalitionkit-cli
          - coalitionkit-conformance
          - coalitionkit-contracts
          - coalitionkit-edges
          - coalitionkit-gardener
          - coalitionkit-langchain
          - coalitionkit-langgraph
          - coalitionkit-mcp
          - coalitionkit-mint
          - coalitionkit-models
          - coalitionkit-packs
          - coalitionkit-runtime
          - coalitionkit-server
          - coalitionkit-steward
          - coalitionkit-surfaces
          - coalitionkit-vault
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Keep only this package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir one
          mv "dist/${PACKAGE//-/_}"-[0-9]* one/
          ls one
      - name: Publish using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: one/
          # A re-run after a partial failure uploads only what is still missing.
          skip-existing: true
