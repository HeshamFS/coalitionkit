[project]
name = "coalitionkit-workspace"
version = "0.0.0"
description = "CoalitionKit Core workspace root (not published)"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "coalitionkit-contracts",
    "coalitionkit-vault",
    "coalitionkit-runtime",
    "coalitionkit-edges",
    "coalitionkit-gardener",
    "hypothesis==6.170.13",
    "coalitionkit-models",
    "coalitionkit-steward",
    "coalitionkit-mcp",
    "coalitionkit-acceptance",
    "jsonschema==4.26.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "import-linter==2.15",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
coalitionkit-contracts = { workspace = true }
coalitionkit-vault = { workspace = true }
coalitionkit-runtime = { workspace = true }
coalitionkit-edges = { workspace = true }
coalitionkit-gardener = { workspace = true }
coalitionkit-models = { workspace = true }
coalitionkit-steward = { workspace = true }
coalitionkit-mcp = { workspace = true }
coalitionkit-acceptance = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["coalitionkit_contracts", "coalitionkit_vault", "coalitionkit_runtime", "coalitionkit_edges", "coalitionkit_gardener", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_mcp", "coalitionkit_acceptance"]

[tool.pyright]
include = ["packages/contracts", "packages/vault", "packages/runtime", "packages/edges", "packages/gardener", "packages/models", "packages/steward", "packages/mcp_server", "packages/acceptance", "tools"]
exclude = ["**/.venv", "**/__pycache__"]
pythonVersion = "3.15"
extraPaths = ["packages/contracts/tests", "packages/edges/tests"]
typeCheckingMode = "strict"

[tool.importlinter]
root_packages = ["coalitionkit_contracts", "coalitionkit_vault", "coalitionkit_runtime", "coalitionkit_edges", "coalitionkit_gardener", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_mcp", "coalitionkit_acceptance"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contracts imports no other coalitionkit package"
type = "forbidden"
source_modules = ["coalitionkit_contracts"]
# import-linter has no partial wildcards: add each new coalitionkit_* package here.
forbidden_modules = [
    "coalitionkit",
    "coalitionkit_acceptance",
    "coalitionkit_conformance",
    "coalitionkit_edge",
    "coalitionkit_edges",
    "coalitionkit_gardener",
    "coalitionkit_host",
    "coalitionkit_mcp",
    "coalitionkit_models",
    "coalitionkit_packs",
    "coalitionkit_psi",
    "coalitionkit_runtime",
    "coalitionkit_steward",
    "coalitionkit_surfaces",
    "coalitionkit_vault",
]

[[tool.importlinter.contracts]]
name = "vault imports only contracts from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_vault"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp",
    "coalitionkit_packs", "coalitionkit_psi", "coalitionkit_runtime",
    "coalitionkit_steward", "coalitionkit_surfaces",
]

[[tool.importlinter.contracts]]
name = "edges import only contracts from coalitionkit (not the runtime yet)"
type = "forbidden"
source_modules = ["coalitionkit_edges"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp",
    "coalitionkit_packs", "coalitionkit_psi", "coalitionkit_runtime",
    "coalitionkit_steward", "coalitionkit_surfaces", "coalitionkit_vault",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
pythonpath = ["packages/contracts/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[[tool.importlinter.contracts]]
name = "runtime uses contracts only"
type = "forbidden"
source_modules = ["coalitionkit_runtime"]
forbidden_modules = ["coalitionkit_acceptance", "coalitionkit_vault", "coalitionkit_gardener", "coalitionkit_surfaces", "coalitionkit_mcp", "coalitionkit_edge"]

[[tool.importlinter.contracts]]
name = "gardener imports only contracts from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_gardener"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_edges", "coalitionkit_host", "coalitionkit_mcp",
    "coalitionkit_packs", "coalitionkit_psi", "coalitionkit_runtime",
    "coalitionkit_steward", "coalitionkit_surfaces", "coalitionkit_vault",
]

[[tool.importlinter.contracts]]
name = "models imports only contracts from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_models"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge", "coalitionkit_edges",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp", "coalitionkit_packs",
    "coalitionkit_psi", "coalitionkit_runtime", "coalitionkit_steward", "coalitionkit_surfaces",
    "coalitionkit_vault",
]

[[tool.importlinter.contracts]]
name = "steward imports only contracts and models from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_steward"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge", "coalitionkit_edges",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp", "coalitionkit_packs",
    "coalitionkit_psi", "coalitionkit_runtime", "coalitionkit_surfaces", "coalitionkit_vault",
]

[[tool.importlinter.contracts]]
name = "mcp imports contracts and the edge host port only (never the runtime)"
type = "forbidden"
source_modules = ["coalitionkit_mcp"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_packs",
    "coalitionkit_psi", "coalitionkit_runtime", "coalitionkit_steward",
    "coalitionkit_surfaces", "coalitionkit_vault",
    "coalitionkit_edges.a2a.client", "coalitionkit_edges.a2a.identity",
    "coalitionkit_edges.a2a.server", "coalitionkit_edges.a2a.wire",
]
