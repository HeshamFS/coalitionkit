# SPDX-License-Identifier: Apache-2.0
[project]
name = "coalitionkit-workspace"
version = "0.0.0"
description = "CoalitionKit Core workspace root (not published)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]
dev = [
    "coalitionkit-conformance",
    "coalitionkit-contracts",
    "coalitionkit-vault[psi]",
    "coalitionkit-runtime[postgres]",
    "coalitionkit-edges",
    "coalitionkit-gardener",
    "hypothesis==6.170.15",
    "coalitionkit-mint",
    "coalitionkit-models",
    "coalitionkit-steward",
    "coalitionkit-mcp",
    "coalitionkit-acceptance",
    "coalitionkit-surfaces",
    "coalitionkit-server",
    "coalitionkit-cli",
    "coalitionkit-packs",
    "coalitionkit-channels",
    "coalitionkit-langchain",
    "coalitionkit-langgraph",
    "langchain==1.4.8",
    "langchain-openai==1.7.3",
    "jsonschema==4.26.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "import-linter==2.15",
    "ruff==0.17.3",
]

[tool.uv]
package = false
# zstandard has no CPython 3.15 wheel and its sdist needs a C toolchain. langsmith (via
# langchain-core) lists it, but only uses it to compress tracing uploads.
override-dependencies = ["zstandard; python_version < '3.15'"]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/coalitionkit"]

[tool.uv.sources]
coalitionkit-conformance = { workspace = true }
coalitionkit-contracts = { workspace = true }
coalitionkit-vault = { workspace = true }
coalitionkit-runtime = { workspace = true }
coalitionkit-edges = { workspace = true }
coalitionkit-gardener = { workspace = true }
coalitionkit-models = { workspace = true }
coalitionkit-mint = { workspace = true }
coalitionkit-steward = { workspace = true }
coalitionkit-mcp = { workspace = true }
coalitionkit-acceptance = { workspace = true }
coalitionkit-surfaces = { workspace = true }
coalitionkit-server = { workspace = true }
coalitionkit-cli = { workspace = true }
coalitionkit-packs = { workspace = true }
coalitionkit-channels = { workspace = true }
coalitionkit-langchain = { workspace = true }
coalitionkit-langgraph = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# The contracts tests import a helper module named "examples"; the top-level examples/ folder
# must not turn it into a first-party import.
known-third-party = ["examples"]
known-first-party = ["coalitionkit_contracts", "coalitionkit_vault", "coalitionkit_runtime", "coalitionkit_edges", "coalitionkit_gardener", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_mcp", "coalitionkit_acceptance", "coalitionkit_surfaces", "coalitionkit_server", "coalitionkit_packs", "coalitionkit_mint", "coalitionkit_channels", "coalitionkit_cli"]

[tool.pyright]
include = ["packages/langchain", "packages/langgraph", "packages/cli", "packages/contracts", "packages/vault", "packages/runtime", "packages/edges", "packages/gardener", "packages/models", "packages/steward", "packages/mcp_server", "packages/acceptance", "packages/surfaces", "packages/server", "packages/packs", "packages/mint", "packages/channels", "tools", "packages/conformance"]
exclude = ["**/.venv", "**/__pycache__"]
pythonVersion = "3.12"
extraPaths = ["packages/contracts/tests", "packages/edges/tests", "packages/surfaces/tests", "packages/packs/tests", "packages/channels/tests", "packages/server/tests"]
typeCheckingMode = "strict"

[tool.importlinter]
root_packages = ["coalitionkit_contracts", "coalitionkit_vault", "coalitionkit_runtime", "coalitionkit_edges", "coalitionkit_gardener", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_mcp", "coalitionkit_acceptance", "coalitionkit_surfaces", "coalitionkit_server", "coalitionkit_packs", "coalitionkit_mint", "coalitionkit_channels", "coalitionkit_cli", "coalitionkit_conformance"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contracts imports no other coalitionkit package"
type = "forbidden"
source_modules = ["coalitionkit_contracts"]
# import-linter has no partial wildcards: add each new coalitionkit_* package here.
forbidden_modules = [
    "coalitionkit",
    "coalitionkit_acceptance",
    "coalitionkit_conformance",
    "coalitionkit_edge",
    "coalitionkit_edges",
    "coalitionkit_gardener",
    "coalitionkit_host",
    "coalitionkit_mcp",
    "coalitionkit_models",
    "coalitionkit_packs",
    "coalitionkit_psi",
    "coalitionkit_runtime",
    "coalitionkit_steward",
    "coalitionkit_surfaces",
    "coalitionkit_vault",
]

[[tool.importlinter.contracts]]
name = "vault imports only contracts from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_vault"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp",
    "coalitionkit_packs", "coalitionkit_psi", "coalitionkit_runtime",
    "coalitionkit_steward", "coalitionkit_surfaces",
]

[[tool.importlinter.contracts]]
name = "edges import only contracts from coalitionkit (not the runtime yet)"
type = "forbidden"
source_modules = ["coalitionkit_edges"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp",
    "coalitionkit_packs", "coalitionkit_psi", "coalitionkit_runtime",
    "coalitionkit_steward", "coalitionkit_surfaces", "coalitionkit_vault",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib -p no:langsmith_plugin"
pythonpath = ["packages/contracts/tests", "packages/surfaces/tests", "packages/packs/tests", "packages/channels/tests", "packages/server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # pysodium 0.7.19 declares a ctypes struct with _pack_ and no _layout_; Python 3.15 warns on
    # non-Windows platforms. Third-party and harmless until 3.19; drop when pysodium sets it.
    "ignore:Due to '_pack_':DeprecationWarning:pysodium",
    # langsmith (via langchain-core) calls this at import time, and it goes in Python 3.16. Drop
    # this when langsmith moves to inspect.iscoroutinefunction.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # Windows only: asyncio's proactor pipe transports of subprocesses that exited are finalized
    # after their loop closed (CPython's own __del__ warns). Not a leak in this code.
    "ignore:Exception ignored in. <function _ProactorBasePipeTransport.__del__:pytest.PytestUnraisableExceptionWarning",
]
markers = ["live: calls the real Meta Model API; runs only with COALITIONKIT_LIVE=1 and the provider keys set (COALITIONKIT_META_API_KEY; WhatsApp: token, phone number id, test recipient)"]

[[tool.importlinter.contracts]]
name = "runtime uses contracts only"
type = "forbidden"
source_modules = ["coalitionkit_runtime"]
forbidden_modules = ["coalitionkit_acceptance", "coalitionkit_vault", "coalitionkit_gardener", "coalitionkit_surfaces", "coalitionkit_mcp", "coalitionkit_edge"]

[[tool.importlinter.contracts]]
name = "gardener imports only contracts from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_gardener"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_edges", "coalitionkit_host", "coalitionkit_mcp",
    "coalitionkit_packs", "coalitionkit_psi", "coalitionkit_runtime",
    "coalitionkit_steward", "coalitionkit_surfaces", "coalitionkit_vault",
]

[[tool.importlinter.contracts]]
name = "models imports only contracts from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_models"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge", "coalitionkit_edges",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp", "coalitionkit_packs",
    "coalitionkit_psi", "coalitionkit_runtime", "coalitionkit_steward", "coalitionkit_surfaces",
    "coalitionkit_vault",
]

[[tool.importlinter.contracts]]
name = "steward imports only contracts and models from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_steward"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge", "coalitionkit_edges",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp", "coalitionkit_packs",
    "coalitionkit_psi", "coalitionkit_runtime", "coalitionkit_surfaces", "coalitionkit_vault",
]

[[tool.importlinter.contracts]]
name = "mcp imports contracts and the edge host port only (never the runtime)"
type = "forbidden"
source_modules = ["coalitionkit_mcp"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_packs",
    "coalitionkit_psi", "coalitionkit_runtime", "coalitionkit_steward",
    "coalitionkit_surfaces", "coalitionkit_vault",
    "coalitionkit_edges.a2a.client", "coalitionkit_edges.a2a.identity",
    "coalitionkit_edges.a2a.server", "coalitionkit_edges.a2a.wire",
]

[[tool.importlinter.contracts]]
name = "surfaces import only contracts and runtime from coalitionkit"
type = "forbidden"
source_modules = ["coalitionkit_surfaces"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_conformance", "coalitionkit_edge", "coalitionkit_edges",
    "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp", "coalitionkit_models",
    "coalitionkit_packs", "coalitionkit_psi", "coalitionkit_steward", "coalitionkit_vault",
    "coalitionkit_acceptance",
]

[[tool.importlinter.contracts]]
name = "server never imports acceptance"
type = "forbidden"
source_modules = ["coalitionkit_server"]
forbidden_modules = ["coalitionkit_acceptance"]

[[tool.importlinter.contracts]]
name = "library packages never import the composition server"
type = "forbidden"
source_modules = ["coalitionkit_contracts", "coalitionkit_runtime", "coalitionkit_edges", "coalitionkit_mcp", "coalitionkit_surfaces", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_gardener", "coalitionkit_vault", "coalitionkit_packs"]
forbidden_modules = ["coalitionkit_server"]

[[tool.importlinter.contracts]]
name = "packs import only contracts, steward and surfaces directly (models, runtime only via them)"
type = "forbidden"
source_modules = ["coalitionkit_packs"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_edges", "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp",
    "coalitionkit_psi", "coalitionkit_vault", "coalitionkit_server",
]

[[tool.importlinter.contracts]]
name = "mint uses only models, steward, edges, contracts and vault"
type = "forbidden"
source_modules = ["coalitionkit_mint"]
forbidden_modules = ["coalitionkit_runtime", "coalitionkit_gardener", "coalitionkit_surfaces", "coalitionkit_mcp", "coalitionkit_packs", "coalitionkit_server", "coalitionkit_acceptance"]

[[tool.importlinter.contracts]]
name = "only acceptance and server may import mint"
type = "forbidden"
source_modules = ["coalitionkit_contracts", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_edges", "coalitionkit_vault", "coalitionkit_runtime", "coalitionkit_gardener", "coalitionkit_surfaces", "coalitionkit_mcp", "coalitionkit_packs"]
forbidden_modules = ["coalitionkit_mint"]

# Template imports use the fail-closed AST allowlist in coalitionkit_mint.scan.
# test_template_scan enforces it; a forbidden-import list cannot cover new network clients.

[[tool.importlinter.contracts]]
name = "channels import only contracts and surfaces directly (runtime only via surfaces)"
type = "forbidden"
source_modules = ["coalitionkit_channels"]
forbidden_modules = [
    "coalitionkit", "coalitionkit_acceptance", "coalitionkit_conformance", "coalitionkit_edge",
    "coalitionkit_edges", "coalitionkit_gardener", "coalitionkit_host", "coalitionkit_mcp",
    "coalitionkit_models", "coalitionkit_packs", "coalitionkit_psi",
    "coalitionkit_steward", "coalitionkit_vault", "coalitionkit_server", "coalitionkit_mint",
]

[[tool.importlinter.contracts]]
name = "core packages never import channels"
type = "forbidden"
source_modules = ["coalitionkit_contracts", "coalitionkit_runtime", "coalitionkit_edges", "coalitionkit_mcp", "coalitionkit_surfaces", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_gardener", "coalitionkit_vault", "coalitionkit_packs", "coalitionkit_mint"]
forbidden_modules = ["coalitionkit_channels"]

[[tool.importlinter.contracts]]
name = "nothing imports cli"
type = "forbidden"
source_modules = ["coalitionkit_contracts", "coalitionkit_vault", "coalitionkit_runtime", "coalitionkit_edges", "coalitionkit_gardener", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_mcp", "coalitionkit_acceptance", "coalitionkit_surfaces", "coalitionkit_server", "coalitionkit_packs", "coalitionkit_mint", "coalitionkit_channels", "coalitionkit_conformance"]
forbidden_modules = ["coalitionkit_cli"]

[[tool.importlinter.contracts]]
name = "cli directly imports only server, contracts and mcp gateway"
type = "forbidden"
source_modules = ["coalitionkit_cli"]
allow_indirect_imports = true
forbidden_modules = ["coalitionkit_vault", "coalitionkit_runtime", "coalitionkit_edges", "coalitionkit_gardener", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_acceptance", "coalitionkit_surfaces", "coalitionkit_packs", "coalitionkit_mint", "coalitionkit_channels"]

[[tool.importlinter.contracts]]
name = "conformance uses only contracts and client edges"
type = "forbidden"
source_modules = ["coalitionkit_conformance"]
forbidden_modules = ["coalitionkit_server", "coalitionkit_runtime", "coalitionkit_surfaces", "coalitionkit_vault", "coalitionkit_models", "coalitionkit_steward", "coalitionkit_gardener", "coalitionkit_mcp", "coalitionkit_acceptance", "coalitionkit_packs", "coalitionkit_mint", "coalitionkit_channels", "coalitionkit_edges.a2a.server", "coalitionkit_edges.a2a.host_port"]
